[package]
name = "sx-vault-media"
version = "0.1.0"
edition = "2024"
build = "src/build.rs"

[dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
ciborium = "0.2.2"
colored = "3.1.1"
infer = "0.22.0"
prost = "0.14.4"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["full", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7.19"
tonic = "0.14.6"
tonic-prost = "0.14"
uuid = { version = "1.18.1", features = ["v4"] }
zip = "8.6.0"

[build-dependencies]
tonic-build = { version = "0.14.6", features = ["transport"] }
tonic-prost-build = "0.14.6"
