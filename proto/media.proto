syntax = "proto3";

package media;

service MediaService {
    rpc UploadVideo (stream UploadChunkRequest) returns (stream ProgressResponse);
}

message UploadChunkRequest {
    string id = 1;
    bytes chunk_data = 2;
    uint64 sequence_number = 3;
}

message ProgressResponse {
    string id = 1;
    string state = 2;
    string message = 3;
    optional bool is_success = 4;
    float percentage = 5;
}